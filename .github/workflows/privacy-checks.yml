name: Code and synthetic dashboard checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.13.0'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python scripts/check_repository_privacy.py
      - run: uv run python -m pytest -q
      - run: uv run python scripts/generate_demo_data.py --output .runtime/demo-data
      - run: uv run python scripts/build_dashboard_static.py --source .runtime/demo-data --target .runtime/demo-site --synthetic
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check_dashboard.mjs --site .runtime/demo-site
      - run: uv run python scripts/patient_studies.py --synthetic --output .runtime/patient-atlas-fixtures
      - run: uv run python scripts/build_patient_site.py --source .runtime/patient-atlas-fixtures --target .runtime/patient-atlas-site
      - run: node scripts/check_patient_dashboard.mjs --site .runtime/patient-atlas-site
    # No data upload, build-artifact upload, or Pages deployment is authorized.
