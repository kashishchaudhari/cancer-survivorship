[project]
name = "cancer-survivorship-atlas"
version = "0.1.0"
description = "Privacy-aware cancer cohort pipelines, treatment patterns, and temporal survival evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "lifelines>=0.30,<0.31",
  "xgboost>=3,<4",
  "jsonschema>=4,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
